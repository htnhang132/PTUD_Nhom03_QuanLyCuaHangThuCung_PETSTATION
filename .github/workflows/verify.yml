name: Verify Java

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: ['feature/**']

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ['17', '21']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Require develop as source for main
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: test "$SOURCE_BRANCH" = develop
      - name: Fetch pinned formatter
        run: bash ./mvnw -B -ntp dependency:get -Dartifact=com.google.googlejavaformat:google-java-format:1.24.0:jar:all-deps
      - name: Check coding convention
        run: find src -name '*.java' -print0 | xargs -0 java -jar "$HOME/.m2/repository/com/google/googlejavaformat/google-java-format/1.24.0/google-java-format-1.24.0-all-deps.jar" --aosp --dry-run --set-exit-if-changed
      - name: Build and run tests without SQL Server
        run: bash ./mvnw -B -ntp verify
      - name: State SQL test limitation
        if: always()
        run: echo 'CI does not run the SQL Server integration suites. Run scripts/test-sqlserver.ps1 against the isolated test database and attach the results to the PR.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}-jdk${{ matrix.java }}
          path: target/surefire-reports/
